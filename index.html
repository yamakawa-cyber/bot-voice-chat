<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7eb6"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><title>ボットとおしゃべり</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><button id="back" class="hdr" hidden aria-label="戻る">←</button><h1 id="title">ボットとおしゃべり</h1>
<span id="counter" title="今日の回数">0/100</span><button id="gear" class="hdr" aria-label="設定">⚙</button></header>
<main>
<section id="pick"><ul id="bots"></ul></section>
<section id="chat" hidden>
 <div id="log" aria-live="polite"></div>
 <div id="status"></div>
 <div class="row"><button id="talk" class="big">🎤 押して話す</button>
  <label class="tog"><input type="checkbox" id="cont"> 会話モード</label></div>
 <form id="tf" class="row"><input id="ti" placeholder="文字でも送れます" autocomplete="off"><button>送信</button></form>
 <div class="row"><button id="stop">⏹ 止める</button><button id="clear">履歴を消す</button></div>
</section>
<section id="settings" hidden>
 <label>AIの会社<select id="prov"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option><option value="xai">xAI (Grok API)</option><option value="custom">OpenAI互換(その他)</option><option value="mock">テスト用(ダミー)</option></select></label>
 <label>モデル<input id="model" placeholder="空欄で既定"></label>
 <label>接続先URL(その他のみ)<input id="base" placeholder="https://.../v1"></label>
 <label>APIキー(このスマホにだけ保存)<input id="key" type="password" autocomplete="off"></label>
 <label>1日の上限回数<input id="limit" type="number" min="1" value="100"></label>
 <label>声の出し方<select id="tts"><option value="browser">スマホの読み上げ</option><option value="voicevox">VOICEVOX(準備中)</option></select></label>
 <button id="save" class="big">保存</button>
 <p class="note">キーはこの端末のブラウザ内(localStorage)にだけ保存され、ファイルやバックアップには入りません。</p>
</section>
</main>
<script src="js/llm.js?v=4"></script><script src="js/tts.js?v=4"></script><script src="js/app.js?v=4"></script>
</body></html>
